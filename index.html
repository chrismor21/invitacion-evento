<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar asistencia</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff6f8, #ffe4ec);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CONTENEDOR */
.container {
  background: white;
  width: 90%;
  max-width: 350px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  text-align: center;
  animation: fadeIn 1s ease;
}

/* ANIMACIÓN ENTRADA */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px);}
  to { opacity: 1; transform: translateY(0);}
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

/* BOTÓN */
button {
  width: 100%;
  padding: 14px;
  background: #25d366;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  display: none;
  transition: 0.3s;
}

/* EFECTO HOVER / TOUCH */
button:active {
  transform: scale(0.97);
}

button:hover {
  background: #128c7e;
}

/* TITULO */
h2 {
  margin-bottom: 10px;
}

/* TEXTO */
small {
  color: gray;
}
</style>
</head>

<body>

<div class="container">
  <h2>🎉 Confirmar asistencia</h2>

  <input type="text" id="nombre" placeholder="Tu nombre">

  <select id="asistencia">
    <option value="">¿Asistirás?</option>
    <option value="si">Sí, asistiré</option>
    <option value="no">No podré</option>
    <option value="duda">No estoy seguro</option>
  </select>

  <select id="num" disabled>
    <option value="">¿Cuántas personas?</option>
  </select>

  <button id="btn" onclick="enviar()">Enviar por WhatsApp</button>

  <small>Confirma tu asistencia fácilmente</small>
</div>

<script>
// llenar opciones dinámicamente
let select = document.getElementById("num");
for (let i = 1; i <= 10; i++) {
  let opt = document.createElement("option");
  opt.value = i;
  opt.text = i;
  select.appendChild(opt);
}

document.addEventListener("input", function() {
  let nombre = document.getElementById("nombre").value.trim();
  let asistencia = document.getElementById("asistencia").value;
  let num = document.getElementById("num");
  let btn = document.getElementById("btn");

  if (asistencia === "si") {
    num.disabled = false;
  } else {
    num.disabled = true;
    num.value = "";
  }

  if (nombre && asistencia && (asistencia !== "si" || num.value)) {
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
});

function enviar() {
  let nombre = document.getElementById("nombre").value.trim();
  let asistencia = document.getElementById("asistencia").value;
  let num = document.getElementById("num").value;

  let mensaje = `Hola, mi nombre es ${nombre}`;

  if (asistencia === "si") {
    mensaje += ` y asistiré con ${num} persona(s). 🎉`;
  } else if (asistencia === "no") {
    mensaje += ` y no podré asistir. 😔`;
  } else {
    mensaje += ` y aún no estoy seguro. 🤔`;
  }

  let url = "https://wa.me/525611761561?text=" + encodeURIComponent(mensaje);
  window.open(url, "_blank");
}
</script>

</body>
</html>
